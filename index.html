<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>History Fib Finder</title>
<meta name="description" content="A pass-and-play party game: spot the fake among three weird history facts.">
<style>
/* Layout: one centered column like a museum exhibit wall; score strip on top, big tappable "exhibit label" cards, a rubber stamp marks the fib */
:root{
  --bg:#E4EFEC; --panel:#FFFFFF; --ink:#1C2A38; --muted:#56666F; --line:#C5D8D2;
  --accent:#F2A922; --accent-deep:#C4850B; --accent-ink:#2B1D00;
  --fib:#D3473A; --good:#1F8A5A; --good-soft:#DDF1E7; --fib-soft:#FBE4E1;
  --p1:#E0603F; --p2:#2F7FD1; --p3:#23905F; --p4:#8A5BD6;
  --display:"Rockwell","Roboto Slab","Courier New",serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11201E; --panel:#1B2D2B; --ink:#EAF2EF; --muted:#A7B9B4; --line:#2F4744;
    --accent:#F5B53A; --accent-deep:#B57A08; --accent-ink:#2B1D00;
    --fib:#FF7A6B; --good:#4CC98E; --good-soft:#1C3A2E; --fib-soft:#3D2522;
    --p1:#FF8A6A; --p2:#6AAEFF; --p3:#4CC98E; --p4:#B596F5;
    color-scheme:dark;
  }
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;overflow-x:hidden;-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}
.screen{display:flex;flex-direction:column;gap:18px}

/* score strip */
.scores{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--panel);border:2px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums}
.chip.now{border-color:var(--ink)}
.dot{width:14px;height:14px;border-radius:50%;flex:none;display:inline-block}

/* buttons */
.btn{appearance:none;-webkit-appearance:none;border:0;cursor:pointer;min-height:58px;padding:12px 24px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font:700 21px/1.1 var(--body);box-shadow:0 5px 0 var(--accent-deep);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-deep)}
.btn:focus-visible,.fact:focus-visible,.pick:focus-visible,.link:focus-visible{outline:3px solid var(--p2);outline-offset:3px}
.link{appearance:none;-webkit-appearance:none;background:none;border:0;color:var(--muted);font:600 16px var(--body);text-decoration:underline;cursor:pointer;min-height:48px;padding:0 12px;align-self:center}

/* start */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:12px}
.hero h1{font-size:clamp(34px,9vw,48px)}
.stamp-logo{position:relative;width:200px;height:120px;max-width:100%}
.mini{position:absolute;width:120px;height:70px;border-radius:12px;background:var(--panel);border:2px solid var(--line);display:flex;flex-direction:column;gap:8px;padding:14px}
.mini i{display:block;height:8px;border-radius:4px;background:var(--line)}
.mini i:last-child{width:60%}
.mini.a{left:0;top:0;transform:rotate(-6deg)}
.mini.b{right:0;top:30px;transform:rotate(5deg)}
.rubber{position:absolute;right:6px;top:46px;font-family:var(--display);font-weight:700;font-size:26px;color:var(--fib);border:3px solid var(--fib);border-radius:8px;padding:0 8px;transform:rotate(-14deg);background:var(--panel)}
.rule{font-size:19px;max-width:30ch}
.ask{font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:14px}
.picks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:340px}
.pick{appearance:none;-webkit-appearance:none;cursor:pointer;min-height:64px;border-radius:16px;border:3px solid var(--line);background:var(--panel);color:var(--ink);font:800 26px var(--body)}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}

/* round */
.head{display:flex;flex-direction:column;gap:6px;text-align:center}
.eyebrow{font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:14px}
.head h2{font-size:clamp(24px,6.5vw,30px)}
.facts{display:flex;flex-direction:column;gap:12px}
.fact{position:relative;appearance:none;-webkit-appearance:none;cursor:pointer;width:100%;display:grid;grid-template-columns:40px 40px 1fr;align-items:center;gap:12px;min-height:84px;padding:14px 16px;border-radius:18px;background:var(--panel);border:3px solid var(--line);color:var(--ink);font:500 18px/1.35 var(--body);text-align:left;box-shadow:0 4px 0 var(--line);transition:transform .08s,border-color .15s}
@media (hover:hover){ .fact:not([disabled]):hover{border-color:var(--accent)} }
.fact:not([disabled]):active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.fact[disabled]{cursor:default;color:var(--ink)}
.letter{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:800 19px var(--display)}
.emo{font-size:32px;line-height:1;text-align:center}
.txt{min-width:0}
.fact.true{opacity:.75}
.fact.isfib{border-color:var(--fib);background:var(--fib-soft);opacity:1}
.fact.isfib .letter{background:var(--fib);color:#fff}
.tag{position:absolute;top:-12px;right:14px;font:800 15px var(--display);letter-spacing:.05em;padding:2px 10px;border-radius:8px;border:3px solid currentColor;background:var(--panel);transform:rotate(-8deg)}
.tag.f{color:var(--fib);font-size:20px;animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both}
.tag.t{color:var(--good);transform:none}
.voters{grid-column:3;display:flex;gap:6px;flex-wrap:wrap}
.voters .dot{width:auto;height:auto;padding:2px 8px;border-radius:999px;color:#fff;font:700 13px var(--body)}
@keyframes stamp{0%{transform:scale(2.4) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}

/* reveal */
.truth{background:var(--panel);border:2px dashed var(--line);border-radius:16px;padding:14px 16px;font-size:18px}
.truth b{color:var(--fib)}
.results{display:flex;flex-direction:column;gap:8px}
.res{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;font-weight:600}
.res.yes{background:var(--good-soft);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.res.no{background:var(--panel);border:2px solid var(--line)}
.res .pt{margin-left:auto;font-weight:800;color:var(--good)}
@keyframes pop{0%{transform:scale(.85)}100%{transform:scale(1)}}

/* pass */
.pass{align-items:center;text-align:center;padding-top:40px;gap:22px}
.bigdot{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 40px var(--display)}
.pass h2{font-size:34px}

/* end */
.board{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--panel);border:3px solid var(--line);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.row.win{border-color:var(--accent)}
.row .n{margin-left:auto;font-size:24px}
.trophy{font-size:64px;text-align:center;line-height:1;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}

/* confetti */
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.bit{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
  #confetti{display:none}
}
</style>
</head>
<body>
<div id="confetti" aria-hidden="true"></div>
<div class="wrap">
  <div class="scores" id="scores" hidden></div>

  <section class="screen" id="s-start">
    <div class="hero">
      <div class="stamp-logo" aria-hidden="true">
        <div class="mini a"><i></i><i></i><i></i></div>
        <div class="mini b"><i></i><i></i><i></i></div>
        <div class="rubber">FIB!</div>
      </div>
      <h1>History Fib Finder</h1>
      <p class="rule">Two weird history facts are true and one is a fib. Tap the fib to score!</p>
      <p class="ask">How many players?</p>
      <div class="picks" id="picks">
        <button class="pick" id="pick1" type="button" aria-pressed="true" data-n="1">1</button>
        <button class="pick" id="pick2" type="button" aria-pressed="false" data-n="2">2</button>
        <button class="pick" id="pick3" type="button" aria-pressed="false" data-n="3">3</button>
        <button class="pick" id="pick4" type="button" aria-pressed="false" data-n="4">4</button>
      </div>
      <button class="btn" id="startBtn" type="button">Start</button>
    </div>
  </section>

  <section class="screen pass" id="s-pass" hidden>
    <div class="bigdot" id="passDot">2</div>
    <h2 id="passTitle">Pass to Player 2</h2>
    <p class="rule">No peeking at other players' picks!</p>
    <button class="btn" id="readyBtn" type="button">I'm ready</button>
  </section>

  <section class="screen" id="s-round" hidden>
    <div class="head">
      <p class="eyebrow" id="roundLabel">Round 1 of 5</p>
      <h2 id="prompt">Tap the fib!</h2>
    </div>
    <div class="facts" id="facts"></div>
    <div id="after" hidden class="screen">
      <p class="truth" id="truth"></p>
      <div class="results" id="results"></div>
      <button class="btn" id="nextBtn" type="button">Next round</button>
    </div>
  </section>

  <section class="screen" id="s-end" hidden>
    <div class="trophy" aria-hidden="true">🏆</div>
    <div class="head"><p class="eyebrow">Final scores</p><h2 id="winner">Player 1 wins!</h2></div>
    <div class="board" id="board"></div>
    <button class="btn" id="againBtn" type="button">Play again</button>
    <button class="link" id="changeBtn" type="button">Change number of players</button>
  </section>
</div>

<script>
// Each round: two true facts, one fib, and the truth behind the fib.
const BANK = [
  {t:[["🍅","Ketchup was once sold as medicine."],["🫧","Bubble wrap was first made to be wallpaper."]], f:["🍭","The first popsicle was invented by a king in the year 1600."], why:"An 11-year-old boy invented the popsicle by accident in 1905, when his drink froze outside overnight."},
  {t:[["🧽","Play-Doh was first made to clean dirty wallpaper."],["🪨","Some ancient Egyptians rested their heads on pillows made of stone."]], f:["⛑️","Vikings wore helmets with horns on them into battle."], why:"No Viking battle helmet with horns has ever been found. The horns came from costumes in the 1800s."},
  {t:[["🍫","The Aztecs used cocoa beans as money."],["🗼","The Eiffel Tower was only supposed to stand for 20 years."]], f:["🌕","You can see the Great Wall of China from the Moon with just your eyes."], why:"The Great Wall is far too thin to see from the Moon."},
  {t:[["🥕","Long ago, most carrots were purple or yellow, not orange."],["🍞","Sliced bread was first sold in 1928."]], f:["🛡️","Knights in armor could not stand up if they fell over."], why:"Armor was made for moving. Knights could run, climb and get up just fine."},
  {t:[["🗽","The Statue of Liberty used to be shiny brown, like a new penny."],["🪥","Early toothbrushes in China used hairs from pigs."]], f:["🍕","The first pizza was made in Japan."], why:"Pizza as we know it comes from Naples, in Italy."},
  {t:[["🎲","Ancient Egyptians played a board game called Senet."],["🎡","The first Ferris wheel was built for a fair in Chicago in 1893."]], f:["🚲","Ancient Romans rode bicycles to get around."], why:"Bicycles were not invented until the 1800s."},
  {t:[["♟️","People have been playing chess for more than 1,000 years."],["🍬","People have been chewing gum for thousands of years."]], f:["🎢","The ancient Greeks built the first roller coaster."], why:"Roller coasters grew out of giant ice slides in Russia in the 1600s."},
  {t:[["🧸","The teddy bear was named after a US president."],["🥪","The sandwich is named after an English earl."]], f:["🐘","Elephants lifted the stones to build the Egyptian pyramids."], why:"Workers moved the huge stones with sleds, ramps and lots of teamwork."},
  {t:[["👖","Blue jeans were first made as tough work clothes for miners."],["👓","Eyeglasses were invented more than 700 years ago."]], f:["🎮","The first video game was made in the 1800s."], why:"The first video games were made in the 1950s."},
  {t:[["🍦","Ice cream cones became famous at a big fair in 1904."],["🏅","The ancient Greeks held the first Olympic Games."]], f:["👟","Ancient Romans wore sneakers with rubber soles."], why:"Rubber-soled sneakers did not appear until the 1800s."},
  {t:[["📜","Ancient Egyptians made paper from a plant called papyrus."],["📧","The first email was sent more than 50 years ago."]], f:["✈️","The first airplane flight lasted a whole day."], why:"The first airplane flight, in 1903, lasted about 12 seconds."},
  {t:[["🐈","Ancient Egyptians loved cats so much that some cats were made into mummies."],["🍿","People have been eating popcorn for thousands of years."]], f:["🦖","Dinosaurs and the first people lived at the same time."], why:"Dinosaurs died out about 66 million years before the first people."}
];
const ROUNDS = 5;
const COLORS = ["--p1","--p2","--p3","--p4"];
const CHEERS = ["Spotted it!","Great eye!","Fib found!","History detective!"];
const GENTLE = ["So close! That one was true.","Good guess! Next one's yours.","Nice try! That one really happened."];

let players = 1, scores = [], deck = [], r = 0, p = 0, votes = [];
const $ = id => document.getElementById(id);
const col = i => `var(${COLORS[i]})`;
const pickOne = a => a[Math.floor(Math.random()*a.length)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function show(id){
  ["s-start","s-pass","s-round","s-end"].forEach(s => $(s).hidden = s!==id);
  $("scores").hidden = id==="s-start";
  window.scrollTo(0,0);
}
function drawScores(active){
  $("scores").innerHTML = scores.map((s,i)=>
    `<span class="chip${i===active?" now":""}"><span class="dot" style="background:${col(i)}"></span>${players>1?"Player "+(i+1):"Score"}: ${s}</span>`).join("");
}

// Start screen: player count
$("picks").addEventListener("click", e => {
  const b = e.target.closest(".pick"); if(!b) return;
  players = +b.dataset.n;
  document.querySelectorAll(".pick").forEach(x => x.setAttribute("aria-pressed", x===b));
});
$("startBtn").onclick = newGame;
$("againBtn").onclick = newGame;
$("changeBtn").onclick = () => show("s-start");

function newGame(){
  scores = Array(players).fill(0);
  // Build each round from its answer: the fib is placed first, then the order is shuffled.
  deck = shuffle(BANK).slice(0,ROUNDS).map(b => ({
    items: shuffle([...b.t.map(x=>({e:x[0],t:x[1],fib:false})), {e:b.f[0],t:b.f[1],fib:true}]),
    why: b.why
  }));
  r = 0; startRound();
}
function startRound(){ votes = []; p = 0; turn(); }
function turn(){
  if(p>0){
    drawScores(p);
    $("passDot").style.background = col(p);
    $("passDot").textContent = p+1;
    $("passTitle").textContent = `Pass to Player ${p+1}`;
    show("s-pass");
  } else drawRound();
}
$("readyBtn").onclick = drawRound;

function letterOf(i){ return "ABC"[i]; }
function drawRound(){
  const rd = deck[r];
  drawScores(players>1 ? p : -1);
  $("roundLabel").textContent = `Round ${r+1} of ${ROUNDS}`;
  $("prompt").textContent = players>1 ? `Player ${p+1}, tap the fib!` : "Tap the fib!";
  $("prompt").style.color = players>1 ? col(p) : "";
  $("after").hidden = true;
  $("facts").innerHTML = rd.items.map((it,i)=>
    `<button class="fact" type="button" data-i="${i}"><span class="letter">${letterOf(i)}</span><span class="emo" aria-hidden="true">${it.e}</span><span class="txt">${it.t}</span></button>`).join("");
  show("s-round");
}
$("facts").addEventListener("click", e => {
  const b = e.target.closest(".fact"); if(!b || b.disabled) return;
  votes[p] = +b.dataset.i; p++;
  if(p<players) turn(); else reveal();
});

function reveal(){
  const rd = deck[r];
  const fibIdx = rd.items.findIndex(x=>x.fib);
  let anyRight = false;
  votes.forEach((v,k)=>{ if(v===fibIdx){ scores[k]++; anyRight = true; } });
  drawScores(-1);
  $("prompt").textContent = "Here's the fib!";
  $("prompt").style.color = "";
  $("facts").innerHTML = rd.items.map((it,i)=>{
    const who = votes.map((v,k)=>v===i?k:-1).filter(k=>k>=0);
    const chips = who.length ? `<span class="voters">${who.map(k=>`<span class="dot" style="background:${col(k)}">${players>1?"P"+(k+1):"Your pick"}</span>`).join("")}</span>` : "";
    return `<button class="fact ${it.fib?"isfib":"true"}" type="button" disabled><span class="letter">${letterOf(i)}</span><span class="emo" aria-hidden="true">${it.e}</span><span class="txt">${it.t}</span>${chips}<span class="tag ${it.fib?"f":"t"}">${it.fib?"FIB!":"TRUE"}</span></button>`;
  }).join("");
  $("truth").innerHTML = `<b>The truth:</b> ${rd.why}`;
  $("results").innerHTML = votes.map((v,k)=>{
    const ok = v===fibIdx;
    const who = players>1 ? `<span class="dot" style="background:${col(k)}"></span>Player ${k+1}: ` : "";
    return `<div class="res ${ok?"yes":"no"}">${who}${ok?pickOne(CHEERS):pickOne(GENTLE)}${ok?'<span class="pt">+1</span>':""}</div>`;
  }).join("");
  $("nextBtn").textContent = r < ROUNDS-1 ? "Next round" : "See final scores";
  $("after").hidden = false;
  if(anyRight) confetti();
}
$("nextBtn").onclick = () => { r++; if(r<ROUNDS) startRound(); else finish(); };

function finish(){
  const best = Math.max(...scores);
  const winners = scores.map((s,i)=>s===best?i:-1).filter(i=>i>=0);
  if(players===1) $("winner").textContent = `You found ${best} of ${ROUNDS} fibs!`;
  else if(winners.length===1) $("winner").textContent = `Player ${winners[0]+1} wins!`;
  else $("winner").textContent = `It's a tie! ${winners.map(i=>"Player "+(i+1)).join(" and ")} share the win!`;
  $("board").innerHTML = scores.map((s,i)=>
    `<div class="row${s===best&&players>1?" win":""}"><span class="dot" style="background:${col(i)}"></span>${players>1?"Player "+(i+1):"Your score"}<span class="n">${s}</span></div>`).join("");
  drawScores(-1);
  show("s-end");
  confetti();
}

function confetti(){
  const box = $("confetti");
  const cs = getComputedStyle(document.documentElement);
  const palette = ["--accent","--p1","--p2","--p3","--p4"].map(v=>cs.getPropertyValue(v).trim());
  for(let i=0;i<40;i++){
    const d = document.createElement("div");
    d.className = "bit";
    d.style.left = Math.random()*100 + "%";
    d.style.background = pickOne(palette);
    d.style.animationDuration = (1.4 + Math.random()*1.2) + "s";
    d.style.animationDelay = (Math.random()*0.3) + "s";
    box.appendChild(d);
    setTimeout(()=>d.remove(), 3200);
  }
}
</script>
</body>
</html>
